name: Preparar projeto e gerar primeiro hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.import.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Importar a base exata do ZIP e aplicar as alteracoes
        id: import
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/complete ]; then
            BASE=0d7fe58884d99f275f3238e8dbe29ddee69fa9e8
            git fetch --depth=1 https://github.com/Louis-CFM/coucou.git "$BASE"
            git archive FETCH_HEAD | tar -x
            python - <<'PY'
          import hashlib, json
          from pathlib import Path, PurePosixPath
          data = json.loads(Path('.bootstrap/changes.json').read_text(encoding='utf-8'))
          assert data['upstream'] == '0d7fe58884d99f275f3238e8dbe29ddee69fa9e8'
          for file in data['files']:
              rel = PurePosixPath(file['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              body = file['content'].encode('utf-8')
              assert hashlib.sha256(body).hexdigest() == file['sha256']
              path = Path(*rel.parts)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(body)
          Path('.bootstrap/complete').write_text(data['upstream'] + '\n')
          Path('.bootstrap/changes.json').unlink()
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Importar Coucou personalizado com WhatsApp, nome configuravel e hotfixes'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: import
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: custom-hotfix-${{ runner.os }}-${{ hashFiles('windows/Cargo.lock') }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --import ./tests/setup.mjs --test --test-force-exit --test-timeout=20000 "tests/**/*.test.mjs"
      - run: cargo build --release --locked -p coucou-hook
      - run: npm run hotfix
      - run: cargo test --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Hotfix-Windows
          path: windows/release/hotfix-*/
          if-no-files-found: error
          retention-days: 14
